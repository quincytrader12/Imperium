[project]
name = "imperium"
version = "0.1.0"
description = "Self-contained algorithmic crypto trading terminal for Binance Spot."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "websockets>=12.0",
    "numpy>=1.26",
    "pydantic>=2.7",
    # Windows ships no IANA time zone database, so zoneinfo cannot resolve
    # "America/New_York" there without this. Everything in this program that
    # is scheduled against the US session -- the trading day boundary, the
    # daily brief -- depends on that lookup, and without tzdata it falls back
    # to a fixed -5 offset that is an hour wrong for most of the year.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "scipy>=1.13",
    "pyinstaller>=6.6",
    "pyyaml>=6.0",
]

[project.scripts]
imperium = "imperium.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/imperium"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:imperium.*"]

[dependency-groups]
dev = [
    "pypdf>=6.18.1",
]
